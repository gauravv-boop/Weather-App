<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather App</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(to right, #4facfe, #00f2fe);
    }

    .container{
      width:350px;
      background:white;
      padding:25px;
      border-radius:15px;
      text-align:center;
      box-shadow:0 5px 15px rgba(0,0,0,0.2);
    }

    h1{
      margin-bottom:20px;
      color:#333;
    }

    input{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:10px;
      outline:none;
      margin-bottom:15px;
      font-size:16px;
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      background:#4facfe;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#008cff;
    }

    .weather{
      margin-top:20px;
      display:none;
    }

    .weather img{
      width:100px;
    }

    .temp{
      font-size:35px;
      margin:10px 0;
      color:#333;
    }

    .city{
      font-size:25px;
      color:#555;
    }

    .details{
      margin-top:15px;
      display:flex;
      justify-content:space-between;
    }

    .details div{
      text-align:center;
    }

  </style>
</head>

<body>

  <div class="container">

    <h1>Weather App 🌦️</h1>

    <input type="text" id="cityInput" placeholder="Enter city name">

    <button onclick="getWeather()">Search</button>

    <div class="weather" id="weatherBox">

      <img id="weatherIcon" src="" alt="Weather Icon">

      <div class="temp" id="temperature">0°C</div>

      <div class="city" id="cityName">City</div>

      <div class="details">

        <div>
          <h3 id="humidity">0%</h3>
          <p>Humidity</p>
        </div>

        <div>
          <h3 id="wind">0 km/h</h3>
          <p>Wind Speed</p>
        </div>

      </div>

    </div>

  </div>

  <script>


async function getWeather() {

    const apiKey = "62f69779c58f62c8fbf908523662290a";

    const city = document.getElementById("cityInput").value.trim();

    if (city === "") {
        alert("Please enter city name");
        return;
    }

    const apiURL =
    `https://api.openweathermap.org/data/2.5/weather?q=${city}&units=metric&appid=${apiKey}`;

    try {

        const response = await fetch(apiURL);

        const data = await response.json();

        console.log(data);

        if (data.cod != 200) {
            alert("City not found");
            return;
        }

        document.getElementById("weatherBox").style.display = "block";

        document.getElementById("temperature").innerHTML =
            Math.round(data.main.temp) + "°C";

        document.getElementById("cityName").innerHTML =
            data.name;

        document.getElementById("humidity").innerHTML =
            data.main.humidity + "%";

        document.getElementById("wind").innerHTML =
            data.wind.speed + " km/h";

        const weatherMain = data.weather[0].main;

        let iconURL = "";

        if (weatherMain === "Clouds") {
            iconURL = "https://cdn-icons-png.flaticon.com/512/414/414825.png";
        }

        else if (weatherMain === "Clear") {
            iconURL = "https://cdn-icons-png.flaticon.com/512/869/869869.png";
        }

        else if (weatherMain === "Rain") {
            iconURL = "https://cdn-icons-png.flaticon.com/512/3351/3351979.png";
        }

        else if (weatherMain === "Snow") {
            iconURL = "https://cdn-icons-png.flaticon.com/512/642/642102.png";
        }

        else {
            iconURL = "https://cdn-icons-png.flaticon.com/512/1779/1779940.png";
        }

        document.getElementById("weatherIcon").src = iconURL;

    }

    catch (error) {
        console.log(error);
        alert("Something went wrong");
    }
}



  </script>

</body>
</html>
